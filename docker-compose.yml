# Autofix su una VM dedicata. I sandbox non stanno qui: li crea l'orchestrator a ogni task,
# sulla rete `autofix_sandbox`, con HTTPS_PROXY=http://proxy:3128.
#
# Immagini pubblicate su GHCR dalla CI (pubbliche: niente `docker login`). Si sceglie la
# versione con AUTOFIX_TAG (default `main`, oppure `sha-<commit>` o `v1.2.3`) o si fissa ogni
# immagine per digest con AUTOFIX_ORCHESTRATOR_IMAGE / AUTOFIX_WEB_IMAGE / AUTOFIX_SANDBOX_IMAGE.
# `build:` resta per chi costruisce in locale: `docker compose build` usa gli stessi nomi.
services:
  orchestrator:
    build: .
    image: ${AUTOFIX_ORCHESTRATOR_IMAGE:-ghcr.io/rh363/autofix-orchestrator:${AUTOFIX_TAG:-main}}
    restart: unless-stopped
    command: ["schedule"]
    user: "1000:1000"
    group_add: ["${DOCKER_GID:?gid del socket docker: stat -c %g /var/run/docker.sock}"]
    secrets: [anthropic_api_key]   # i file in ./secrets devono essere dell'utente 1000
    environment:
      AUTOFIX_CONFIG: /etc/autofix/config.yaml
      AUTOFIX_SANDBOX_IMAGE: ${AUTOFIX_SANDBOX_IMAGE:-ghcr.io/rh363/autofix-sandbox:${AUTOFIX_TAG:-main}}
      TZ: Europe/Rome
    volumes:
      - ./config.yaml:/etc/autofix/config.yaml:ro
      - /var/lib/autofix:/var/lib/autofix   # stesso path su host e container: i bind mount dei sandbox funzionano
      - /var/run/docker.sock:/var/run/docker.sock
      # Token GitLab: un file per token di gitlab.tokens (secrets/gitlab_tokens/<nome>)
      - ./secrets/gitlab_tokens:/run/secrets/gitlab_tokens:ro
      # Registry interni: credenziali di sola lettura (utente:password) per il ~/.netrc dei
      # sandbox, una per voce di sandbox.registry_credentials. Mai nel servizio web.
      - ./secrets/registry_credentials:/run/secrets/registry_credentials:ro
      # Allowlist locale del proxy: letta solo per controllare che non copra GitLab
      - ./proxy/local:/etc/autofix/proxy-local:ro
      # GitLab interno con CA privata: decommenta e imposta gitlab.ca_bundle in config.yaml
      # - ./ca/gitlab-ca.pem:/etc/autofix/gitlab-ca.pem:ro
    networks: [egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "autofix", "status"]
      interval: 5m
      timeout: 30s
      retries: 3
    depends_on: [proxy]

  proxy:
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/local:/etc/squid/local:ro   # extra-registries.txt: registry interni, fuori da git
    networks: [egress, sandbox]
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 1m
      timeout: 10s
      retries: 3

  # Dashboard in sola lettura (profilo `web`). Niente socket Docker, niente segreti del bot né
  # chiave Anthropic: db montato read-only, solo il client OIDC e la chiave delle sessioni.
  # La porta è pubblicata solo su loopback: davanti serve un reverse proxy con TLS.
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    image: ${AUTOFIX_WEB_IMAGE:-ghcr.io/rh363/autofix-web:${AUTOFIX_TAG:-main}}
    restart: unless-stopped
    command: ["web"]
    profiles: [web]
    user: "1000:1000"
    secrets: [oidc_client_secret, web_session_secret]
    environment:
      AUTOFIX_CONFIG: /etc/autofix/config.yaml
    volumes:
      - ./config.yaml:/etc/autofix/config.yaml:ro
      - /var/lib/autofix:/var/lib/autofix:ro
      # - ./ca/gitlab-ca.pem:/etc/autofix/gitlab-ca.pem:ro   # login OIDC verso GitLab interno
    ports: ["127.0.0.1:8080:8080"]
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3

  # Immagine dei sandbox: non è un servizio da avviare, la lancia l'orchestrator a ogni task.
  # Sta qui solo per scaricarla (`docker compose --profile sandbox pull`) o costruirla in
  # locale (`docker compose --profile sandbox build sandbox-image`).
  sandbox-image:
    build: ./sandbox
    image: ${AUTOFIX_SANDBOX_IMAGE:-ghcr.io/rh363/autofix-sandbox:${AUTOFIX_TAG:-main}}
    profiles: [sandbox]

networks:
  egress: {}
  web: {}            # esce solo verso l'IdP (discovery, token, JWKS)
  sandbox:
    name: autofix_sandbox
    internal: true   # nessuna rotta verso l'esterno: si esce solo dal proxy

secrets:
  anthropic_api_key: {file: ./secrets/anthropic_api_key}
  oidc_client_secret: {file: ./secrets/oidc_client_secret}
  web_session_secret: {file: ./secrets/web_session_secret}
