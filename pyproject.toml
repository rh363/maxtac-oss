[project]
name = "maxtac"
version = "0.1.0"
description = "Autofix self-hosted: CVE, finding SAST e bug nei repo GitLab, con Merge Request già verificate"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "docker>=7.2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-gitlab>=8.6.0",
    "pyyaml>=6.0",
]

[project.scripts]
maxtac = "maxtac.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.154.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "types-docker>=7.2.0.20261006",
    "bandit>=1.9.4",
    "maxtac[web]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxtac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: integrazione con un Docker reale (AUTOFIX_DOCKER_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
