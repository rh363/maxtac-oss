# Config di fiducia dell'orchestrator. Mai dentro i repo: un file nel repo sarebbe input non fidato.
# I segreti (anthropic_api_key, gitlab_token) stanno in /run/secrets come Docker secret.
gitlab:
  url: https://gitlab.example.it
  bot_username: autofix-bot
  bot_name: Autofix Bot
  bot_email: autofix-bot@noreply.gitlab.example.it
  # GitLab self-hosted con certificato di una CA interna: il bundle PEM vale per API, git e
  # (se l'IdP è GitLab stesso) per il login della dashboard. Va montato nei container
  # orchestrator e web (vedi docker-compose.yml). Il sandbox non lo riceve.
  # ca_bundle: /etc/autofix/gitlab-ca.pem

schedule:
  timezone: Europe/Rome
  at: "02:30"

budget:
  monthly_credits_usd: 100.0   # crediti API inclusi nel piano: `status` avvisa se la proiezione li supera
  per_night_usd: 3.0
  per_task_usd: 0.80
  triage_per_repo_usd: 0.10
  hunting_per_night_usd: 1.0
  max_mrs_per_night: 3
  max_attempts: 2
  max_iterations: 30
  discovery_per_repo_usd: 0.15  # `autofix repos discover`: tetto per repo
  discovery_max_iterations: 12

models:
  triage: claude-haiku-5-5
  fix: claude-sonnet-5-5
  hunt: claude-opus-5-5
  discovery: claude-haiku-5-5   # propone linguaggi e comandi di setup/test dei repo nuovi

anthropic:
  timeout_s: 600
  max_retries: 4              # 429, 5xx e overloaded, con backoff dell'SDK
  # Su un rifiuto dei classificatori la richiesta riparte lato server su un altro modello
  # (solo Opus 5.5 e Sonnet 5.5). Il costo si conta al prezzo del modello che ha risposto;
  # se non è in prices_usd_per_mtok, al prezzo più alto noto.
  refusal_fallback: true
  fallback_models: [claude-opus-5-5, claude-sonnet-5-5]
  effort:
    claude-haiku-5-5: low
    claude-sonnet-5-5: medium
    claude-opus-5-5: high

# Attivazione a fasi: CVE (fase 2), SAST (fase 3), bug hunting (fase 4).
features:
  cve: true
  sast: false
  hunting: false

hunting:
  repos_per_night: 2
  lookback_days: 7

vcs:
  branch_prefix: autofix
  mr_labels: [autofix]

# Tema della CLI (e in futuro della dashboard) per utente. Non cambia nulla su GitLab.
notify:
  # riepilogo del mattino su un webhook generico (Slack, Mattermost, n8n...): testo neutro.
  # L'URL è un segreto: /run/secrets/notify_webhook_url
  webhook: false

ui:
  default_theme: neutral
  themes:                         # per email (o username se web.user_claim: username)
    alice@example.com: cyberpunk

# Dashboard web (`autofix web`, servizio `web` del compose). Login OIDC con PKCE: su GitLab
# crea un'Application (User Settings > Applications, non serve admin), confidential, scope
# openid, profile ed email, redirect URI qui sotto. L'issuer è l'URL di GitLab.
# Segreti: /run/secrets/oidc_client_secret e /run/secrets/web_session_secret.
web:
  user_claim: email               # email verificata dell'id_token (email_verified: true)
  allowed_users: [alice@example.com, bob@example.com]   # tutti gli altri ricevono 403
  oidc:
    issuer: https://gitlab.example.it
    client_id: "<application id>"
    redirect_uri: https://autofix.example.it/auth/callback
    scopes: [openid, profile, email]
    username_claims: [preferred_username, nickname]   # usati solo con user_claim: username
  session_max_age_s: 28800
  trusted_proxies: []             # es. ["172.16.0.0/12"] se il reverse proxy passa X-Forwarded-For
  # dev_user: alice@example.com   # solo `autofix web --dev`, bind su loopback

# Container effimeri per scan, fix e verifica. Mai root; nessun segreto dentro.
sandbox:
  image: autofix-sandbox:latest
  network: autofix_sandbox        # rete Docker internal: esce solo dal proxy
  proxy_url: http://proxy:3128
  user: "1000:1000"               # stesso uid dell'orchestrator
  mem_limit: 4g
  cpus: 2.0
  pids_limit: 512

scanners:
  semgrep:
    rulesets: [p/default]
    by_language:                  # aggiunti solo per i linguaggi presenti nei repo
      python: [p/python]
      go: [p/golang]
      javascript: [p/javascript]
      typescript: [p/typescript]

workdir: /var/lib/autofix/work
db_path: /var/lib/autofix/autofix.sqlite3

# Repo scritti a mano (config di fiducia). Si possono anche scoprire con
# `autofix repos discover` e approvare con `autofix repos approve`: in caso di conflitto vince
# questa lista. Può restare vuota.
repos:
  - project: team/api
    languages: [python]
    setup_command: pip install -r requirements.txt
    test_command: pytest -q
  - project: team/agent
    languages: [go]
    test_command: go test ./...

# Prezzi in USD per milione di token: il costo di ogni chiamata si calcola da `usage`.
prices_usd_per_mtok:
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.00, output: 10.0, cache_read: 0.10, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.0, cache_read: 0.20, cache_write: 5.00}
