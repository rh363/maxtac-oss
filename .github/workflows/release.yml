# Pubblica le immagini su GHCR (private) dopo un CI verde.
# - push su main: tag `main` e `sha-<commit>`
# - tag v*:       tag semver e `latest`
# - lunedì 04:17 UTC: ricostruisce solo il sandbox (scanner e database delle vulnerabilità
#   aggiornati); la VM lo scarica con scripts/update.sh
# Ogni immagine ha provenance e SBOM di buildx ed è firmata con cosign keyless
# (verifica: scripts/verify-images.sh).
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # firma keyless cosign
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: autofix-orchestrator
            context: .
            file: Dockerfile
            description: "Autofix: run notturna di scan, fix verificati e merge request"
          - image: autofix-web
            context: .
            file: Dockerfile.web
            description: "Autofix: dashboard in sola lettura"
          - image: autofix-sandbox
            context: sandbox
            file: sandbox/Dockerfile
            description: "Autofix: ambiente isolato con toolchain e scanner"
    steps:
      - name: skip on the weekly schedule unless sandbox
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.image }}" != "autofix-sandbox" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Etichette neutre: senza override metadata-action userebbe nome e descrizione del repo.
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Autofix
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
      - if: steps.gate.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # la rebuild settimanale del sandbox deve prendere scanner e database nuovi
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - if: steps.gate.outputs.run == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: steps.gate.outputs.run == 'true'
        name: sign
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - if: steps.gate.outputs.run == 'true'
        name: summary
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo '```'
            echo "$REF"
            echo '```'
            echo
            echo "Tag: $(echo "$TAGS" | tr '\n' ' ')"
            echo
            echo "Per fissare questa versione sulla VM, nel file .env:"
            echo
            echo '```'
            echo "AUTOFIX_$(echo "${{ matrix.image }}" | sed 's/^autofix-//' | tr a-z A-Z)_IMAGE=$REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
